[project]
name = "ews-finance"
version = "0.1.0"
description = "Financial table extraction from annual report PDFs"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "docling>=2.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.1",
    "PyMuPDF>=1.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "app*",
    "sources*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
