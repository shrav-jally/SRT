<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EWS — Master Pipeline Flowchart (LLM-First)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f7fafc;
            color: #2d3748;
            overflow: auto;
        }
        .header {
            background: linear-gradient(135deg, #44337a, #805ad5);
            color: #fff;
            padding: 32px 48px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(68,51,122,0.3);
        }
        .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .header .subtitle { font-size: 14px; opacity: 0.85; }
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            padding: 14px;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 72px;
            z-index: 99;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; }
        .legend-swatch { width: 18px; height: 12px; border-radius: 3px; }
        .chart-container { padding: 40px 20px; display: flex; justify-content: center; }
        .chart-container svg { display: block; }

        .fc { font-family: 'Segoe UI', system-ui, sans-serif; }
        .fc-title { font-size: 13px; fill: #fff; font-weight: 700; }
        .fc-sub { font-size: 9px; fill: rgba(255,255,255,0.85); font-weight: 600; letter-spacing: 0.5px; }
        .fc-label { font-size: 11px; fill: #2d3748; font-weight: 500; }
        .fc-sm { font-size: 9px; fill: #718096; }
        .fc-yes { font-size: 9px; fill: #38a169; font-weight: 700; }
        .fc-no { font-size: 9px; fill: #d69e2e; font-weight: 700; }
        .fc-llm { font-size: 9px; fill: #805ad5; font-weight: 700; }
        .fc-white { font-size: 10px; fill: #fff; font-weight: 600; }
        .fc-badge { font-size: 8px; fill: rgba(255,255,255,0.9); font-weight: 700; letter-spacing: 0.3px; }
        .fc-step { font-size: 10px; fill: #1a365d; font-weight: 700; }
        .fc-why-title { font-size: 10px; fill: #2a4365; font-weight: 700; }
        .fc-why-body { font-size: 8.5px; fill: #2c5282; }
        .fc-how-title { font-size: 10px; fill: #44337a; font-weight: 700; }
        .fc-how-body { font-size: 8.5px; fill: #553c9a; }
        .fc-std-title { font-size: 10px; fill: #975a16; font-weight: 700; }
        .fc-std-body { font-size: 8.5px; fill: #975a16; }

        @media print { .header, .legend { position: static; } }
    </style>
</head>
<body>

<div class="header">
    <h1>EWS Annual Report Extraction Agent</h1>
    <div class="subtitle">Master Pipeline Flowchart — LLM-First Architecture with Why, How & Financial Standards</div>
</div>

<div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:#805ad5"></div> ★ LLM Primary</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#2b6cb0"></div> Deterministic Step</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#38a169"></div> Success</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#d69e2e"></div> Warning / Fallback</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#e53e3e"></div> Error</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#edf2f7; border:1px solid #2b6cb0"></div> Decision</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#ebf8ff; border:1px solid #2b6cb0"></div> WHY box</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#e9d8fd; border:1px solid #805ad5"></div> HOW box</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#fefcbf; border:1px solid #d69e2e"></div> STANDARD box</div>
</div>

<div class="chart-container">
<svg width="1400" height="5400" viewBox="0 0 1400 5400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="aB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2b6cb0"/></marker>
        <marker id="aG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#38a169"/></marker>
        <marker id="aP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#805ad5"/></marker>
        <marker id="aY" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#d69e2e"/></marker>
        <marker id="aR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#e53e3e"/></marker>
        <filter id="sh" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/></filter>
    </defs>

    <!-- ================================================================ -->
    <!-- PDF INPUT                                                        -->
    <!-- ================================================================ -->
    <rect x="500" y="20" width="300" height="50" rx="25" fill="#1a365d" filter="url(#sh)"/>
    <text x="650" y="42" text-anchor="middle" class="fc-title">PDF Upload</text>
    <text x="650" y="58" text-anchor="middle" class="fc-badge">ANNUAL REPORT PDF</text>
    <line x1="650" y1="70" x2="650" y2="100" stroke="#2b6cb0" stroke-width="2" marker-end="url(#aB)"/>

    <!-- ================================================================ -->
    <!-- STEP 1: FIND PAGES — LLM-FIRST                                  -->
    <!-- ================================================================ -->
    <rect x="440" y="100" width="420" height="56" rx="8" fill="#805ad5" filter="url(#sh)"/>
    <text x="650" y="122" text-anchor="middle" class="fc-title">Step 1: Find Financial Statement Pages</text>
    <text x="650" y="140" text-anchor="middle" class="fc-badge">★ LLM PAGE ID (PRIMARY) + DETERMINISTIC VALIDATION (SECONDARY)</text>

    <!-- WHY box -->
    <rect x="920" y="90" width="260" height="76" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="930" y="106" class="fc-why-title">❓ WHY — Find Pages</text>
    <text x="930" y="120" class="fc-why-body">Wrong pages → wrong data. Must identify</text>
    <text x="930" y="132" class="fc-why-body">BS, P&L, CF pages before any extraction.</text>
    <text x="930" y="146" class="fc-why-body">Indian ARs are 100+ pages; only 3-12</text>
    <text x="930" y="158" class="fc-why-body">contain the financial statements.</text>
    <line x1="860" y1="128" x2="920" y2="128" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- HOW box -->
    <rect x="1200" y="90" width="190" height="76" rx="6" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
    <text x="1210" y="106" class="fc-how-title">⚙️ HOW — LLM-First</text>
    <text x="1210" y="120" class="fc-how-body">1. Quick det check (cost opt)</text>
    <text x="1210" y="132" class="fc-how-body">2. ★ LLM page ID (primary)</text>
    <text x="1210" y="144" class="fc-how-body">3. Det validation (secondary)</text>
    <text x="1210" y="158" class="fc-how-body">4. Notes (always det)</text>
    <line x1="1180" y1="128" x2="1200" y2="128" stroke="#805ad5" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- STANDARD box -->
    <rect x="80" y="90" width="280" height="76" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/>
    <text x="90" y="106" class="fc-std-title">📜 STANDARD — Schedule III</text>
    <text x="90" y="120" class="fc-std-body">Prescribes exact titles: "Balance Sheet",</text>
    <text x="90" y="132" class="fc-std-body">"Statement of Profit and Loss",</text>
    <text x="90" y="144" class="fc-std-body">"Cash Flow Statement". Standard titles</text>
    <text x="90" y="158" class="fc-std-body">enable quick det check to skip LLM ~70%.</text>
    <line x1="360" y1="128" x2="440" y2="128" stroke="#d69e2e" stroke-width="1" stroke-dasharray="4,3"/>

    <line x1="650" y1="156" x2="650" y2="186" stroke="#2b6cb0" stroke-width="2" marker-end="url(#aB)"/>

    <!-- Sub-step 1a: Quick Deterministic Check -->
    <rect x="470" y="186" width="360" height="44" rx="6" fill="#2b6cb0" filter="url(#sh)"/>
    <text x="650" y="204" text-anchor="middle" class="fc-white">1a. Quick Deterministic Check</text>
    <text x="650" y="218" text-anchor="middle" class="fc-badge">COST OPTIMIZATION · PASS 1 TITLE-AREA SCAN ONLY</text>

    <!-- WHY for quick check -->
    <rect x="920" y="186" width="260" height="44" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="930" y="202" class="fc-why-title">❓ WHY — Quick Det Check First?</text>
    <text x="930" y="216" class="fc-why-body">~70% of Indian ARs use exact Schedule III</text>
    <text x="930" y="228" class="fc-why-body">titles → no LLM needed → saves cost & time.</text>
    <line x1="830" y1="208" x2="920" y2="208" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="4,3"/>

    <line x1="650" y1="230" x2="650" y2="258" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#aB)"/>

    <!-- Diamond: All 3 found with standard titles? -->
    <polygon points="650,258 770,298 650,338 530,298" fill="#edf2f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="650" y="296" text-anchor="middle" class="fc-label">All 3 found?</text>
    <text x="650" y="310" text-anchor="middle" class="fc-sm">confidence ≥ 1.0?</text>

    <!-- Yes → skip LLM (cost optimization) -->
    <line x1="770" y1="298" x2="870" y2="298" stroke="#38a169" stroke-width="1.5"/>
    <text x="810" y="292" class="fc-yes">Yes (~70%)</text>
    <rect x="870" y="280" width="200" height="36" rx="6" fill="#38a169"/>
    <text x="970" y="298" text-anchor="middle" class="fc-white">Skip LLM ✓</text>
    <text x="970" y="310" text-anchor="middle" class="fc-badge">quick_deterministic</text>
    <line x1="970" y1="316" x2="970" y2="490" stroke="#38a169" stroke-width="1.5"/>
    <line x1="970" y1="490" x2="650" y2="490" stroke="#38a169" stroke-width="1.5" marker-end="url(#aG)"/>

    <!-- No → LLM Primary -->
    <line x1="650" y1="338" x2="650" y2="366" stroke="#805ad5" stroke-width="2" marker-end="url(#aP)"/>
    <text x="660" y="356" class="fc-llm">No (~30%)</text>

    <!-- Sub-step 1b: ★ LLM Page Identification (PRIMARY) -->
    <rect x="460" y="366" width="380" height="50" rx="8" fill="#805ad5" filter="url(#sh)"/>
    <text x="650" y="386" text-anchor="middle" class="fc-title">1b. ★ LLM Page Identification (PRIMARY)</text>
    <text x="650" y="404" text-anchor="middle" class="fc-badge">SEND PAGE SNIPPETS → QWEN2.5 → PAGES + STATEMENT_TYPE</text>

    <!-- HOW for LLM page ID -->
    <rect x="920" y="360" width="260" height="62" rx="6" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
    <text x="930" y="376" class="fc-how-title">⚙️ HOW — LLM Page ID</text>
    <text x="930" y="390" class="fc-how-body">Prompt: "Which pages contain BS/P&L/CF?"</text>
    <text x="930" y="402" class="fc-how-body">Returns: {"balance_sheet": [47,48],</text>
    <text x="930" y="414" class="fc-how-body"> "profit_and_loss": [50,51], "statement_type":</text>
    <text x="930" y="426" class="fc-how-body"> "Standalone", "cash_flow": [55]}</text>
    <line x1="840" y1="391" x2="920" y2="391" stroke="#805ad5" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- WHY for LLM primary -->
    <rect x="1200" y="360" width="190" height="62" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="1210" y="376" class="fc-why-title">❓ WHY — LLM Primary</text>
    <text x="1210" y="390" class="fc-why-body">Non-standard titles, OCR</text>
    <text x="1210" y="402" class="fc-why-body">errors, bilingual headers,</text>
    <text x="1210" y="414" class="fc-why-body">CID-fragmented text — LLM</text>
    <text x="1210" y="426" class="fc-why-body">reads context to infer pages.</text>
    <line x1="1180" y1="391" x2="1200" y2="391" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- LLM error path -->
    <line x1="460" y1="391" x2="380" y2="391" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="400" y="383" class="fc-sm" fill="#e53e3e">LLM fail</text>
    <rect x="200" y="373" width="180" height="36" rx="6" fill="#fed7d7" stroke="#e53e3e" stroke-width="1"/>
    <text x="290" y="391" text-anchor="middle" class="fc-sm" fill="#822727" style="font-weight:600">Full Deterministic Fallback</text>
    <text x="290" y="403" text-anchor="middle" class="fc-badge" fill="#822727">3-pass title scan (old method)</text>
    <line x1="290" y1="409" x2="290" y2="490" stroke="#d69e2e" stroke-width="1.5"/>
    <line x1="290" y1="490" x2="500" y2="490" stroke="#d69e2e" stroke-width="1.5" marker-end="url(#aY)"/>

    <line x1="650" y1="416" x2="650" y2="444" stroke="#805ad5" stroke-width="1.5" marker-end="url(#aP)"/>

    <!-- Sub-step 1c: Deterministic Validation (SECONDARY) -->
    <rect x="460" y="444" width="380" height="44" rx="6" fill="#2b6cb0" filter="url(#sh)"/>
    <text x="650" y="462" text-anchor="middle" class="fc-white">1c. Deterministic Validation (SECONDARY)</text>
    <text x="650" y="476" text-anchor="middle" class="fc-badge">MERGE LLM+DET PAGES (UNION) · EXPAND CONTINUATIONS · CROSS-VALIDATE TYPE</text>

    <!-- HOW for validation -->
    <rect x="920" y="444" width="260" height="44" rx="6" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
    <text x="930" y="460" class="fc-how-title">⚙️ HOW — Det Validation</text>
    <text x="930" y="474" class="fc-how-body">Full 3-pass scan → union with LLM pages</text>
    <text x="930" y="486" class="fc-how-body">→ expand continuations → cross-validate type</text>
    <line x1="840" y1="466" x2="920" y2="466" stroke="#805ad5" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- WHY for validation -->
    <rect x="1200" y="444" width="190" height="44" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="1210" y="460" class="fc-why-title">❓ WHY — Det Validation?</text>
    <text x="1210" y="474" class="fc-why-body">Catches LLM hallucinations,</text>
    <text x="1210" y="486" class="fc-why-body">adds missed continuation pages.</text>
    <line x1="1180" y1="466" x2="1200" y2="466" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="4,3"/>

    <line x1="650" y1="488" x2="650" y2="520" stroke="#2b6cb0" stroke-width="2" marker-end="url(#aB)"/>

    <!-- Notes detection (always deterministic) -->
    <rect x="470" y="520" width="360" height="44" rx="6" fill="#2b6cb0" filter="url(#sh)"/>
    <text x="650" y="538" text-anchor="middle" class="fc-white">1d. Detect Notes to Accounts Pages</text>
    <text x="650" y="552" text-anchor="middle" class="fc-badge">ALWAYS DETERMINISTIC · "NOTES TO FINANCIAL STATEMENTS" → SEARCH</text>

    <!-- WHY for Notes -->
    <rect x="920" y="520" width="260" height="44" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="930" y="536" class="fc-why-title">❓ WHY — Notes Detection</text>
    <text x="930" y="550" class="fc-why-body">OFI items (Contingent Liabilities,</text>
    <text x="930" y="562" class="fc-why-body">Related Party, Auditor Remuneration)</text>
    <text x="930" y="574" class="fc-why-body">are ONLY in Notes, not in CF statement.</text>
    <line x1="830" y1="542" x2="920" y2="542" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- STANDARD for Notes -->
    <rect x="80" y="520" width="280" height="44" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/>
    <text x="90" y="536" class="fc-std-title">📜 STANDARD — Ind AS 1 + Sec 211</text>
    <text x="90" y="550" class="fc-std-body">Ind AS 1 mandates numbered notes</text>
    <text x="90" y="562" class="fc-std-body">cross-referenced from BS/P&L/CF.</text>
    <line x1="360" y1="542" x2="470" y2="542" stroke="#d69e2e" stroke-width="1" stroke-dasharray="4,3"/>

    <line x1="650" y1="564" x2="650" y2="610" stroke="#2b6cb0" stroke-width="2" marker-end="url(#aB)"/>

    <!-- ================================================================ -->
    <!-- STEP 2: DETECT YEAR                                             -->
    <!-- ================================================================ -->
    <rect x="470" y="610" width="360" height="56" rx="8" fill="#2b6cb0" filter="url(#sh)"/>
    <text x="650" y="632" text-anchor="middle" class="fc-title">Step 2: Detect Financial Year</text>
    <text x="650" y="650" text-anchor="middle" class="fc-badge">5 FILENAME PATTERNS → PAGE TEXT → LLM VERIFY</text>

    <!-- WHY -->
    <rect x="920" y="610" width="260" height="56" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="930" y="626" class="fc-why-title">❓ WHY — Year Detection</text>
    <text x="930" y="640" class="fc-why-body">Headers have 2 year columns (current +</text>
    <text x="930" y="652" class="fc-why-body">previous). Must pick correct column.</text>
    <text x="930" y="664" class="fc-why-body">Wrong year → wrong data column → all values off.</text>
    <line x1="830" y1="638" x2="920" y2="638" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- STANDARD -->
    <rect x="80" y="610" width="280" height="56" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/>
    <text x="90" y="626" class="fc-std-title">📜 STANDARD — Schedule III + FY Conv</text>
    <text x="90" y="640" class="fc-std-body">BS: "As at March 31, YYYY"</text>
    <text x="90" y="652" class="fc-std-body">P&L: "For the year ended March 31, YYYY"</text>
    <text x="90" y="664" class="fc-std-body">Indian FY: Apr 1 → Mar 31 (ending year)</text>
    <line x1="360" y1="638" x2="470" y2="638" stroke="#d69e2e" stroke-width="1" stroke-dasharray="4,3"/>

    <line x1="650" y1="666" x2="650" y2="690" stroke="#2b6cb0" stroke-width="2" marker-end="url(#aB)"/>

    <!-- Filename patterns -->
    <rect x="480" y="690" width="340" height="110" rx="6" fill="#edf2f7" stroke="#2b6cb0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="650" y="708" text-anchor="middle" class="fc-step">Filename Pattern Matching (5 ordered)</text>
    <text x="500" y="726" class="fc-sm">① <tspan font-weight="600">2022-2023</tspan> → 2023 (full range, HIGH)</text>
    <text x="500" y="742" class="fc-sm">② <tspan font-weight="600">2017-18</tspan> → 2018 (2-digit suffix, HIGH)</text>
    <text x="500" y="758" class="fc-sm">③ <tspan font-weight="600">202021</tspan> → 2021 (compact 6-digit, HIGH)</text>
    <text x="500" y="774" class="fc-sm">④ <tspan font-weight="600">FY2024</tspan> → 2024 (FY prefix, MED)</text>
    <text x="500" y="790" class="fc-sm">⑤ <tspan font-weight="600">2023</tspan> → 2023 (single year, LOW → try page text first)</text>

    <!-- HOW for filename -->
    <rect x="920" y="690" width="260" height="110" rx="6" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
    <text x="930" y="706" class="fc-how-title">⚙️ HOW — Filename Patterns</text>
    <text x="930" y="720" class="fc-how-body">regex: (20\d{2})\s*[-_]\s*(20\d{2})</text>
    <text x="930" y="734" class="fc-how-body">regex: (20\d{2})\s*[-_]\s*(\d{2})</text>
    <text x="930" y="748" class="fc-how-body">regex: (20\d{2})(\d{2}) compact</text>
    <text x="930" y="762" class="fc-how-body">regex: FY\s*(20\d{2})</text>
    <text x="930" y="776" class="fc-how-body">regex: (20\d{2}) single</text>
    <text x="930" y="792" class="fc-how-body">Validation: year2 == year1 + 1</text>
    <line x1="820" y1="745" x2="920" y2="745" stroke="#805ad5" stroke-width="1" stroke-dasharray="4,3"/>

    <line x1="650" y1="800" x2="650" y2="828" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#aB)"/>

    <!-- Diamond: High confidence? -->
    <polygon points="650,828 750,864 650,900 550,864" fill="#edf2f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="650" y="868" text-anchor="middle" class="fc-label">High confidence?</text>

    <!-- Yes -->
    <line x1="750" y1="864" x2="850" y2="864" stroke="#38a169" stroke-width="1.5" marker-end="url(#aG)"/>
    <text x="790" y="858" class="fc-yes">High</text>
    <rect x="850" y="844" width="180" height="40" rx="6" fill="#38a169"/>
    <text x="940" y="861" text-anchor="middle" class="fc-white">Return (year, method)</text>
    <text x="940" y="875" text-anchor="middle" class="fc-badge">e.g. filename_full_range</text>
    <line x1="940" y1="884" x2="940" y2="940" stroke="#38a169" stroke-width="1.5"/>
